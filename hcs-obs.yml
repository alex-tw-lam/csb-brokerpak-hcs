version: 1
name: csb-hcs-obs
id: 13dcaab5-7831-4f0a-b296-fe582294ea32
description: CSB HCS OBS Bucket
display_name: CSB HCS OBS Bucket
image_url: https://doc.hcs.huawei.com/index.html
documentation_url: https://doc.hcs.huawei.com/index.html
provider_display_name: Huawei Cloud Stack
support_url: https://doc.hcs.huawei.com/index.html
tags: [hcs, obs, object-storage, storage]
plan_updateable: true
plans:
- name: default
  id: f21c74ed-a481-4e6d-95c1-24d6298d4368
  description: Default OBS bucket plan
  display_name: Default
  properties: {}
provision:
  plan_inputs: []
  user_inputs:
  - field_name: bucket_name
    type: string
    details: Name of the bucket (globally unique in OBS, DNS-compatible).
    default: csb-${request.instance_id}
    constraints:
      minLength: 3
      maxLength: 63
      pattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
    prohibit_update: true
  - field_name: acl
    type: string
    details: canned ACL for the bucket.
    default: private
    enum:
      private: private
      public-read: public-read
      public-read-write: public-read-write
      log-delivery-write: log-delivery-write
    prohibit_update: true
  - field_name: storage_class
    type: string
    details: Storage class of the bucket.
    default: STANDARD
    enum:
      STANDARD: STANDARD
      WARM: WARM (infrequent access)
      COLD: COLD (archive)
  - field_name: versioning
    type: boolean
    details: Enable object versioning. Once enabled, versioning can only be suspended, never fully disabled.
    default: false
  - field_name: encryption
    type: boolean
    details: Enable default server-side encryption (SSE-KMS).
    default: false
  - field_name: kms_key_id
    type: string
    nullable: true
    default: null
    details: KMS key ID for server-side encryption. When empty, the default master key is used.
  - field_name: enterprise_project_id
    type: string
    nullable: true
    default: null
    details: |
      Enterprise project (resource space) the bucket belongs to. OBS buckets live in
      enterprise projects rather than IAM projects; when empty the account default
      enterprise project is used. Changing it recreates the bucket.
    prohibit_update: true
  - field_name: force_destroy
    type: boolean
    details: Delete all objects when destroying the bucket on deprovision. When false, deprovision fails if the bucket still contains objects.
    default: false
  - field_name: region
    type: string
    details: The HCS region to provision in.
    default: ${config("hcs.region")}
    prohibit_update: true
  - field_name: cloud
    type: string
    details: HCS cloud domain used to derive service endpoints (e.g. "hcs.example.com").
    default: ${config("hcs.cloud")}
    prohibit_update: true
  - field_name: project_name
    type: string
    details: The HCS project (tenant) name.
    default: ${config("hcs.project_name")}
    prohibit_update: true
  computed_inputs:
  - name: labels
    default: ${json.marshal(request.default_labels)}
    overwrite: true
    type: object
  - name: request_context_json
    default: ${json.marshal(request.context)}
    overwrite: true
    type: string
  - name: originating_identity_json
    default: ${json.marshal(request.x_broker_api_originating_identity)}
    overwrite: true
    type: string
  template_refs:
    main: terraform/obs/provision/main.tf
    variables: terraform/obs/provision/variables.tf
    outputs: terraform/obs/provision/outputs.tf
    provider: terraform/obs/provision/provider.tf
    versions: terraform/obs/provision/versions.tf
    data: terraform/obs/provision/data.tf
  outputs:
  - field_name: bucket_name
    type: string
    details: Name of the bucket
  - field_name: bucket_domain_name
    type: string
    details: Domain name of the bucket
  - field_name: region
    type: string
    details: HCS region
  - field_name: cloud
    type: string
    details: HCS cloud domain
  - field_name: project_name
    type: string
    details: HCS project name
bind:
  plan_inputs: []
  user_inputs:
  - field_name: grant_principal
    type: string
    nullable: true
    default: null
    details: |
      Optional OBS principal granted access to the bucket, passed verbatim into the
      bucket policy. Accepted formats: "domain/<account-id>:user/<user-name>" for an
      IAM/VDC user, "domain/<account-id>:group/<group-name>" for a user group (if the
      site's OBS supports group principals), or "domain/<account-id>:agency/<name>" for
      an agency. When set, the bind attaches a bucket policy for this principal; when
      empty (default) the bind only passes through the bucket details. Note the bucket
      policy is a singleton server-side, so only one grant binding should be active
      per bucket.
  - field_name: grant_permission
    type: string
    details: Permission granted to `grant_principal`.
    default: read-write
    enum:
      read: read-only (list + get)
      read-write: read, write and delete objects
  computed_inputs:
  - name: bucket_name
    default: ${instance.details["bucket_name"]}
    overwrite: true
    type: string
  - name: bucket_domain_name
    default: ${instance.details["bucket_domain_name"]}
    overwrite: true
    type: string
  - name: region
    default: ${instance.details["region"]}
    overwrite: true
    type: string
  - name: cloud
    default: ${instance.details["cloud"]}
    overwrite: true
    type: string
  - name: project_name
    default: ${instance.details["project_name"]}
    overwrite: true
    type: string
  template_refs:
    main: terraform/obs/bind/main.tf
    variables: terraform/obs/bind/variables.tf
    outputs: terraform/obs/bind/outputs.tf
    provider: terraform/obs/bind/provider.tf
    versions: terraform/obs/bind/versions.tf
    data: terraform/obs/bind/data.tf
  outputs:
  - field_name: bucket_name
    type: string
    details: Name of the bucket
  - field_name: bucket_domain_name
    type: string
    details: Domain name of the bucket
  - field_name: region
    type: string
    details: HCS region
  - field_name: granted
    type: boolean
    details: Whether a bucket policy was attached for the grant principal
