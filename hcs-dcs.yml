version: 1
name: csb-hcs-dcs
id: b23276b5-f48a-4562-b4d1-5606ad0e63d8
description: CSB HCS Distributed Cache Service (Redis engine)
display_name: CSB HCS DCS
image_url: https://doc.hcs.huawei.com/index.html
documentation_url: https://doc.hcs.huawei.com/index.html
provider_display_name: Huawei Cloud Stack
support_url: https://doc.hcs.huawei.com/index.html
tags: [hcs, redis, dcs, cache]
plan_updateable: true
plans:
- name: small
  id: ffaad285-a8d5-41b1-a59c-0f79aacb6f4c
  description: Single-node Redis 5.0 cache with 0.125GB capacity
  display_name: Small (single node, 0.125GB)
  properties:
    capacity: 0.125
    cache_mode: single
    engine_version: "5.0"
- name: medium
  id: dec64db5-f73e-4869-952e-acf615b3cf0f
  description: Single-node Redis 5.0 cache with 1GB capacity
  display_name: Medium (single node, 1GB)
  properties:
    capacity: 1
    cache_mode: single
    engine_version: "5.0"
- name: large
  id: 7467e48d-677b-4d61-8bfe-6959803d3533
  description: Single-node Redis 5.0 cache with 4GB capacity
  display_name: Large (single node, 4GB)
  properties:
    capacity: 4
    cache_mode: single
    engine_version: "5.0"
- name: ha-large
  id: 8ec947fc-c1d0-4c98-b243-1c97b1ff6b4e
  description: Master/standby Redis 5.0 cache (flavor redis.ha.xu1.large.r2.4, 4GB capacity); requires a standby availability zone
  display_name: HA Large (master/standby, 4GB)
  properties:
    flavor: redis.ha.xu1.large.r2.4
    capacity: 4
    cache_mode: ha
    engine_version: "5.0"
provision:
  plan_inputs:
  - field_name: flavor
    type: string
    details: DCS flavor spec code (site-specific). When a plan does not set a flavor, one is looked up automatically from `capacity`, `cache_mode` and `engine_version`.
  - field_name: capacity
    type: number
    details: Cache capacity in GB (single/ha support 0.125-64; cluster starts at 4; the matching DCS flavor is looked up automatically).
  - field_name: cache_mode
    type: string
    details: DCS cache mode.
    enum:
      single: single node (no DCS accounts - bind unavailable)
      ha: master/standby
      cluster: cluster
      proxy: proxy cluster
  - field_name: engine_version
    type: string
    details: Redis engine version.
    enum:
      "3.0": Redis 3.0 (compatibility)
      "4.0": Redis 4.0
      "5.0": Redis 5.0
      "6.0": Redis 6.0
  user_inputs:
  - field_name: instance_name
    type: string
    details: Name of the DCS instance.
    default: csb-dcs-${request.instance_id}
    constraints:
      minLength: 4
      maxLength: 64
      pattern: ^[a-zA-Z][a-zA-Z0-9-]*$
  - field_name: availability_zone
    type: string
    required: true
    details: Primary availability zone (site-specific, e.g. "az1").
    prohibit_update: true
  - field_name: standby_availability_zone
    type: string
    nullable: true
    default: null
    details: Standby availability zone for "ha" cache mode. Ignored for single-node mode.
    prohibit_update: true
  - field_name: cpu_architecture
    type: string
    nullable: true
    default: null
    details: CPU architecture filter for the flavor lookup (site-specific, "x86_64" or "aarch64"). When empty, whatever the site offers is used.
    enum:
      x86_64: x86_64
      aarch64: aarch64 (Kunpeng)
    prohibit_update: true
  - field_name: vpc_name
    type: string
    details: Name of an existing VPC for the network. Defaults to the site configuration (HCS_VPC_NAME); can be overridden per instance.
    default: ${config("hcs.vpc_name")}
    prohibit_update: true
  - field_name: subnet_name
    type: string
    details: Name of an existing subnet within `vpc_id`. Defaults to the site configuration (HCS_DCS_SUBNET_NAME); can be overridden per instance.
    default: ${config("hcs.dcs.subnet_name")}
    prohibit_update: true
  - field_name: security_group_name
    type: string
    nullable: true
    default: null
    details: ID of an existing security group (required for Redis 3.0 instances).
    prohibit_update: true
  - field_name: port
    type: integer
    details: Custom port (Redis 4.0 and above only).
    default: 6379
    constraints:
      minimum: 1
      maximum: 65535
  - field_name: password
    type: string
    nullable: true
    default: null
    details: Instance access password. When empty, a random password is generated and returned in the binding credentials.
  - field_name: description
    type: string
    nullable: true
    default: null
    details: Optional description of the instance.
  - field_name: region
    type: string
    details: The HCS region to provision in.
    default: ${config("hcs.region")}
    prohibit_update: true
  - field_name: cloud
    type: string
    details: HCS cloud domain used to derive service endpoints (e.g. "hcs.example.com").
    default: ${config("hcs.cloud")}
    prohibit_update: true
  - field_name: project_name
    type: string
    details: The HCS project (tenant) name.
    default: ${config("hcs.project_name")}
    prohibit_update: true
  computed_inputs:
  - name: labels
    default: ${json.marshal(request.default_labels)}
    overwrite: true
    type: object
  - name: request_context_json
    default: ${json.marshal(request.context)}
    overwrite: true
    type: string
  - name: originating_identity_json
    default: ${json.marshal(request.x_broker_api_originating_identity)}
    overwrite: true
    type: string
  template_refs:
    main: terraform/dcs/provision/main.tf
    variables: terraform/dcs/provision/variables.tf
    outputs: terraform/dcs/provision/outputs.tf
    provider: terraform/dcs/provision/provider.tf
    versions: terraform/dcs/provision/versions.tf
    data: terraform/dcs/provision/data.tf
  outputs:
  - field_name: instance_id
    type: string
    details: ID of the DCS instance
  - field_name: name
    type: string
    details: Name of the DCS instance
  - field_name: domain_name
    type: string
    details: Connection domain name of the instance
  - field_name: port
    type: number
    details: Connection port
  - field_name: password
    type: string
    details: Instance access password
  - field_name: region
    type: string
    details: HCS region
  - field_name: cloud
    type: string
    details: HCS cloud domain
  - field_name: project_name
    type: string
    details: HCS project name
bind:
  plan_inputs: []
  user_inputs:
  - field_name: bind_mode
    type: string
    details: |
      Credential strategy. "account" creates a per-binding DCS account (least
      privilege; requires the site flag feature.dcs2.support.acl - without it
      bind fails with DCS.4967 "The tenant does not support ACL"). "passthrough"
      hands out the instance access password instead and works on any site.
    default: account
    enum:
      account: per-binding DCS account
      passthrough: instance password passthrough
  - field_name: account_name
    type: string
    details: |
      Name of the DCS account created for this binding (hyphens are converted to
      underscores, account mode only). Requires an instance that supports ACL
      accounts - master/standby, cluster or proxy cluster on Redis 6.0; single
      node instances never do.
    default: csb-${str.truncate(16, request.binding_id)}
    constraints:
      minLength: 1
      maxLength: 63
      pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
  - field_name: account_role
    type: string
    details: Privilege of the binding account.
    default: write
    enum:
      read: read-only
      write: read and write
  computed_inputs:
  - name: instance_id
    default: ${instance.details["instance_id"]}
    overwrite: true
    type: string
  - name: instance_password
    default: ${instance.details["password"]}
    overwrite: true
    type: string
  - name: domain_name
    default: ${instance.details["domain_name"]}
    overwrite: true
    type: string
  - name: port
    default: ${instance.details["port"]}
    overwrite: true
    type: number
  - name: region
    default: ${instance.details["region"]}
    overwrite: true
    type: string
  - name: cloud
    default: ${instance.details["cloud"]}
    overwrite: true
    type: string
  - name: project_name
    default: ${instance.details["project_name"]}
    overwrite: true
    type: string
  template_refs:
    main: terraform/dcs/bind/main.tf
    variables: terraform/dcs/bind/variables.tf
    outputs: terraform/dcs/bind/outputs.tf
    provider: terraform/dcs/bind/provider.tf
    versions: terraform/dcs/bind/versions.tf
    data: terraform/dcs/bind/data.tf
  outputs:
  - field_name: username
    type: string
    details: Username of the binding account
  - field_name: password
    type: string
    details: Randomly generated password of the binding account
  - field_name: host
    type: string
    details: Connection domain name of the instance
  - field_name: port
    type: number
    details: Connection port
  - field_name: uri
    type: string
    details: Connection URI
