version: 1
name: csb-hcs-gaussdb
id: a48c4633-3397-4895-9caf-36690a12a368
description: CSB HCS GaussDB (for openGauss)
display_name: CSB HCS GaussDB (for openGauss)
image_url: file://service-images/csb.png
documentation_url: https://doc.hcs.huawei.com/index.html
provider_display_name: Huawei Cloud Stack
support_url: https://doc.hcs.huawei.com/index.html
tags: [hcs, gaussdb, opengauss, database]
plan_updateable: true
plans: []
provision:
  plan_inputs:
  - field_name: flavor
    type: string
    details: GaussDB flavor spec code (site-specific; centralized flavors carry an ".ha" style suffix, distributed flavors a ".in" suffix).
  user_inputs:
  - field_name: instance_name
    type: string
    details: Name of the GaussDB instance.
    default: csb-gaussdb-${request.instance_id}
    constraints:
      minLength: 4
      maxLength: 64
      pattern: ^[a-zA-Z][a-zA-Z0-9-]*$
  - field_name: password
    type: string
    nullable: true
    default: null
    details: Database administrator password. When empty, a random password is generated and returned in the binding credentials.
  - field_name: availability_zones
    type: array
    required: true
    details: Availability zone list, joined according to the chosen `solution` (e.g. ["az1"] for "single", ["az1","az2"] for "double", three AZs for most combined solutions).
    prohibit_update: true
  - field_name: solution
    type: string
    details: Deployment solution (combined solutions hcs1..hcs7 are HCS-specific; the AZ list must match the solution's AZ count).
    default: hcs1
    prohibit_update: true
  - field_name: ha_mode
    type: string
    details: HA deployment mode.
    default: combined
    enum:
      centralization_standard: centralization standard
      combined: combined
    prohibit_update: true
  - field_name: ha_consistency
    type: string
    details: HA consistency level.
    default: eventual
    enum:
      strong: strong
      eventual: eventual
    prohibit_update: true
  - field_name: ha_consistency_protocol
    type: string
    details: HA consistency protocol (replication mode is always sync).
    default: quorum
    enum:
      quorum: quorum
      paxos: paxos
      syncStorage: syncStorage
    prohibit_update: true
  - field_name: volume_type
    type: string
    details: Volume type for the instance.
    default: ULTRAHIGH
    enum:
      ULTRAHIGH: ULTRAHIGH
      LOCALSSD: LOCALSSD
      DORADO: DORADO
    prohibit_update: true
  - field_name: volume_size
    type: integer
    required: true
    details: Storage size in GB per shard (combined 480-6000, centralization 160-2000; multiples of shard size).
    constraints:
      minimum: 160
      maximum: 6000
      multipleOf: 40
  - field_name: port
    type: string
    details: Database port as a string (e.g. "8000"). When customized, the security group must allow port to port+100.
    default: "8000"
    prohibit_update: true
  - field_name: vpc_id
    type: string
    required: true
    details: ID of an existing VPC for the instance network.
    prohibit_update: true
  - field_name: subnet_name
    type: string
    required: true
    details: Name of an existing subnet within `vpc_id`.
    prohibit_update: true
  - field_name: security_group_id
    type: string
    nullable: true
    default: null
    details: ID of an existing security group; required when a custom `port` is used.
    prohibit_update: true
  - field_name: sharding_num
    type: integer
    details: Number of shards (combined solutions only).
    default: 3
    constraints:
      minimum: 1
      maximum: 9
  - field_name: coordinator_num
    type: integer
    details: Number of coordinator nodes (combined solutions only; at most twice the shard count).
    default: 3
    constraints:
      minimum: 1
      maximum: 9
  - field_name: datastore_version
    type: string
    nullable: true
    default: null
    details: GaussDB engine version (e.g. "8.202"). When empty, the latest supported version is used.
    prohibit_update: true
  - field_name: backup_start_time
    type: string
    details: Backup window start (HH:00-(HH+1):00, minutes must be 00).
    default: "03:00-04:00"
    constraints:
      pattern: ^([01][0-9]|2[0-3]):00-([02][0-9]|3[0-1]):00$
  - field_name: backup_keep_days
    type: integer
    details: Number of days to keep automated backups.
    default: 7
    constraints:
      minimum: 0
      maximum: 732
  - field_name: region
    type: string
    details: The HCS region to provision in.
    default: ${config("hcs.region")}
    prohibit_update: true
  - field_name: cloud
    type: string
    details: HCS cloud domain used to derive service endpoints (e.g. "hcs.example.com").
    default: ${config("hcs.cloud")}
    prohibit_update: true
  computed_inputs:
  - name: labels
    default: ${json.marshal(request.default_labels)}
    overwrite: true
    type: object
  template_refs:
    main: terraform/gaussdb/provision/main.tf
    variables: terraform/gaussdb/provision/variables.tf
    outputs: terraform/gaussdb/provision/outputs.tf
    provider: terraform/gaussdb/provision/provider.tf
    versions: terraform/gaussdb/provision/versions.tf
    data: terraform/gaussdb/provision/data.tf
  outputs:
  - field_name: instance_id
    type: string
    details: ID of the GaussDB instance
  - field_name: name
    type: string
    details: Name of the GaussDB instance
  - field_name: endpoints
    type: string
    details: Connection endpoints as comma-joined host:port strings
  - field_name: private_ips
    type: string
    details: Private IP addresses as a comma-joined string
  - field_name: username
    type: string
    details: Administrator username
  - field_name: password
    type: string
    details: Administrator password
  - field_name: port
    type: string
    details: Database port
  - field_name: region
    type: string
    details: HCS region
  - field_name: cloud
    type: string
    details: HCS cloud domain
bind:
  plan_inputs: []
  user_inputs: []
  computed_inputs:
  - name: instance_id
    default: ${instance.details["instance_id"]}
    overwrite: true
    type: string
  - name: endpoints
    default: ${instance.details["endpoints"]}
    overwrite: true
    type: string
  - name: username
    default: ${instance.details["username"]}
    overwrite: true
    type: string
  - name: password
    default: ${instance.details["password"]}
    overwrite: true
    type: string
  - name: port
    default: ${instance.details["port"]}
    overwrite: true
    type: string
  - name: region
    default: ${instance.details["region"]}
    overwrite: true
    type: string
  - name: cloud
    default: ${instance.details["cloud"]}
    overwrite: true
    type: string
  template_refs:
    main: terraform/gaussdb/bind/main.tf
    variables: terraform/gaussdb/bind/variables.tf
    outputs: terraform/gaussdb/bind/outputs.tf
    provider: terraform/gaussdb/bind/provider.tf
    versions: terraform/gaussdb/bind/versions.tf
  outputs:
  - field_name: username
    type: string
    details: Administrator username
  - field_name: password
    type: string
    details: Administrator password
  - field_name: endpoints
    type: array
    details: Connection endpoints as host:port strings
  - field_name: hostname
    type: string
    details: Host of the first connection endpoint
  - field_name: port
    type: string
    details: Database port
  - field_name: uri
    type: string
    details: PostgreSQL-wire compatible connection URI
